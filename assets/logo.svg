<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="50" cy="50" r="48" fill="#060812"/>

  <!-- Golden Celestial Halo & Star Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#pgGold)" stroke-width="2.2" filter="url(#goldGlow)"/>
  <circle cx="50" cy="50" r="42" stroke="url(#pgGold)" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Crescent Moon at top-right -->
  <path d="M68 20 C68 27 73 31 79 31 C75 34 68 33 65 29 C62 25 63 20 68 20 Z" fill="url(#pgGold)" filter="url(#goldGlow)"/>

  <!-- 9 Constellation Stars (Navagraha) -->
  <circle cx="73" cy="16" r="1.1" fill="#FEF08A"/>
  <circle cx="81" cy="20" r="1.3" fill="#FEF08A"/>
  <circle cx="84" cy="28" r="1.1" fill="#FEF08A"/>
  <circle cx="80" cy="36" r="1.3" fill="#FEF08A"/>
  <circle cx="72" cy="40" r="1.0" fill="#FEF08A"/>
  <circle cx="28" cy="74" r="1.3" fill="#FEF08A"/>
  <circle cx="23" cy="66" r="1.1" fill="#FEF08A"/>
  <circle cx="22" cy="58" r="1.0" fill="#FEF08A"/>
  <circle cx="25" cy="50" r="1.2" fill="#FEF08A"/>

  <!-- Stylized Luxury 'PG' Monogram -->
  <!-- 'P' -->
  <path d="M35 28 C45 28 53 32 53 41 C53 49 45 53 35 53 L35 72" stroke="url(#pgGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 28 L35 72" stroke="url(#pgGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 'G' -->
  <path d="M66 45 C62 37 52 37 46 43 C38 51 40 67 52 69 C62 71 68 63 68 55 L53 55" stroke="url(#pgGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
